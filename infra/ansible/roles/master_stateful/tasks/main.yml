---
- name: Create NodeMaster Compose directory
  ansible.builtin.file:
    path: "{{ master_stateful_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Inspect internal Docker network
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - "{{ master_stateful_network_name }}"
  register: master_stateful_network_inspect
  changed_when: false
  failed_when: master_stateful_network_inspect.rc not in [0, 1]

- name: Create internal Docker network when missing
  ansible.builtin.command:
    argv:
      - docker
      - network
      - create
      - "{{ master_stateful_network_name }}"
  when: master_stateful_network_inspect.rc == 1
  changed_when: true

- name: Copy stateful Compose files to NodeMaster
  ansible.builtin.copy:
    src: "{{ master_stateful_compose_source_dir }}/{{ item }}"
    dest: "{{ master_stateful_compose_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ master_stateful_compose_files }}"

- name: Render NodeMaster runtime environment
  ansible.builtin.template:
    src: master.env.j2
    dest: "{{ master_stateful_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Start PostgreSQL, Redis, and RustFS
  community.docker.docker_compose_v2:
    project_src: "{{ master_stateful_compose_dir }}"
    project_name: "{{ master_stateful_project_name }}"
    files: "{{ master_stateful_compose_files }}"
    env_files:
      - .env
    state: present
    pull: missing
    wait: true
    wait_timeout: 120
