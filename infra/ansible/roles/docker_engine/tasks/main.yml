---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: This role supports Ubuntu only.

- name: Resolve Docker APT architecture
  ansible.builtin.set_fact:
    docker_engine_apt_architecture: >-
      {{
        {
          'x86_64': 'amd64'
        }.get(
          ansible_facts['architecture'],
          ansible_facts['architecture']
        )
      }}

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create Docker APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker official signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Configure Docker official APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Architectures: {{ docker_engine_apt_architecture }}
      Signed-By: /etc/apt/keyrings/docker.asc

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Add remote Linux user to Docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Verify Docker daemon
  ansible.builtin.command:
    cmd: docker info
  become: true
  register: docker_engine_info
  changed_when: false

- name: Verify Docker Compose plugin
  ansible.builtin.command:
    cmd: docker compose version
  register: docker_engine_compose_version
  changed_when: false

- name: Show Docker installation result
  ansible.builtin.debug:
    msg:
      docker_service: running
      docker_compose: "{{ docker_engine_compose_version.stdout }}"
