---
services:
  rustfs:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}
      RUSTFS_REGION: ${RUSTFS_REGION:?Set RUSTFS_REGION in .env}
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    command:
      - /data
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - master_internal
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail http://127.0.0.1:9000/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  rustfs_data:
    name: cc_master_rustfs_data

networks:
  master_internal:
    external: true
    name: cc_master_internal
