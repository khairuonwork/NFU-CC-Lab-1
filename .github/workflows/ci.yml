---
name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run Svelte checks
        run: npm run lint

      - name: Build Client
        run: npm run build

  master:
    name: Master Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: service/master

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: service/master/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Compile Master source
        run: uv run python -m compileall app

  worker:
    name: Worker Service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: service/worker

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: service/worker/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Compile Worker source
        run: uv run python -m compileall app

  model:
    name: Model
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: model

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: model/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Compile model source
        run: uv run python -m compileall src scripts

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest

    env:
      ANSIBLE_INVENTORY: ${{ github.workspace }}/.github/ansible/inventory.yml
      ANSIBLE_VAULT_PASSWORD_FILE: ${{ runner.temp }}/ansible-ci-vault-pass

    defaults:
      run:
        working-directory: infra/ansible

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Create CI-only Ansible Vault password
        run: |
          umask 077
          printf '%s\n' 'ci-only-placeholder' \
            > "$RUNNER_TEMP/ansible-ci-vault-pass"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: infra/ansible/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run Ansible lint
        run: uv run ansible-lint playbooks roles

      - name: Run YAML lint
        run: >-
          uv run yamllint
          requirements.yml
          inventory/lab.yml.example
          inventory/group_vars
          inventory/host_vars
          playbooks
          roles

      - name: Run Ansible syntax checks
        run: >-
          uv run ansible-playbook
          --syntax-check
          playbooks/*.yml
